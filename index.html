      media="print" sidesteps that (the browser doesn't need it for the
      current screen render), then the onload swap applies it once it's in.
      <noscript> keeps it working with JS disabled.
    -->

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
