<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>أزوم الزكي</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
  <style>
    :root {
      --brand-50: #f1f9ec; --brand-100: #dff0d3; --brand-200: #bfe0a8; --brand-300: #98cb7c;
      --brand-400: #72b354; --brand-500: #549a3a; --brand-600: #417d2c; --brand-700: #326322;
      --brand-800: #274d1c; --brand-900: #1c3714; --gold-300: #fdb85c; --gold-400: #f5a742; --gold-500: #e8912a;
      --ink: #1c1730;

      --bg: #f6faf3; --bg-glow: rgba(114, 179, 84, .18); --surface: #ffffff; --surface-2: #f1f9ec;
      --text: #1c1730; --muted: rgba(28, 23, 48, .6); --faint: rgba(28, 23, 48, .4);
      --border: #dff0d3; --user-bg: #417d2c; --user-text: #ffffff; --accent: #417d2c; --accent-hover: #326322;
      --shadow: 0 10px 40px -12px rgba(39, 77, 28, .25); --danger: #c0392b;
      --card: rgba(255, 255, 255, .78); --answer: rgba(28, 23, 48, .86); --strong: #326322; --strong-soft: #1c1730;
      --th-bg: #f1f9ec; --row-alt: rgba(241, 249, 236, .55);
    }
    :root[data-theme="dark"] {
      --bg: #141022; --bg-glow: rgba(114, 179, 84, .12); --surface: #1c1730; --surface-2: rgba(255, 255, 255, .05);
      --text: #f4f2fa; --muted: rgba(255, 255, 255, .62); --faint: rgba(255, 255, 255, .38);
      --border: rgba(255, 255, 255, .1); --user-bg: #417d2c; --accent: #72b354; --accent-hover: #98cb7c;
      --shadow: 0 10px 40px -12px rgba(0, 0, 0, .6); --danger: #ff7b6b;
      --card: rgba(255, 255, 255, .05); --answer: rgba(255, 251, 243, .88); --strong: #98cb7c; --strong-soft: #fffbf3;
      --th-bg: rgba(114, 179, 84, .12); --row-alt: rgba(255, 255, 255, .025);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Cairo", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(60rem 30rem at 85% -10%, var(--bg-glow), transparent 60%),
                        radial-gradient(40rem 24rem at -10% 110%, rgba(245, 167, 66, .10), transparent 60%);
      background-attachment: fixed;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .logo-dark { display: none; }
    :root[data-theme="dark"] .logo-light { display: none; }
    :root[data-theme="dark"] .logo-dark { display: block; }

    /* ---------- Login ---------- */
    .login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
    .card {
      width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 24px; padding: 36px 28px 28px; box-shadow: var(--shadow); text-align: center;
      animation: rise .5s ease-out both;
    }
    .card img { height: 52px; margin: 0 auto 18px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px;
      background: var(--surface-2); color: var(--accent); font-size: 12px; font-weight: 700; margin-bottom: 12px;
    }
    .card h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
    .card p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    .field { position: relative; margin-bottom: 12px; }
    .field input {
      width: 100%; padding: 13px 16px; padding-inline-end: 46px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--surface-2); outline: none; transition: border-color .2s, box-shadow .2s; direction: ltr; text-align: center;
    }
    .field input:focus { border-color: var(--brand-400); box-shadow: 0 0 0 4px rgba(114, 179, 84, .18); }
    .field button {
      position: absolute; inset-inline-end: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: 0; color: var(--faint); padding: 6px; display: grid;
    }
    .remember { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 4px 0 18px; }
    .remember input { accent-color: var(--brand-600); width: 16px; height: 16px; }
    .primary {
      width: 100%; border: 0; border-radius: 14px; padding: 13px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--brand-500), var(--brand-700)); box-shadow: 0 8px 20px -8px rgba(65, 125, 44, .6);
      transition: transform .15s, filter .2s;
    }
    .primary:hover { filter: brightness(1.06); }
    .primary:active { transform: scale(.98); }
    .primary:disabled { opacity: .6; cursor: default; }
    .error { color: var(--danger); font-size: 13px; min-height: 20px; margin-top: 12px; }
    .shake { animation: shake .4s; }
    .back { display: inline-block; margin-top: 18px; font-size: 13px; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--accent); }

    /* ---------- Chat ---------- */
    .app { height: 100%; display: flex; flex-direction: column; }
    header.top {
      position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
      background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    header.top img { height: 36px; }
    .title { flex: 1; min-width: 0; }
    .title b { display: block; font-size: 16px; font-weight: 800; line-height: 1.2; }
    .title span { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-400); box-shadow: 0 0 0 3px rgba(114, 179, 84, .25); }
    .iconbtn {
      width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted); transition: color .2s, border-color .2s, background .2s;
    }
    .iconbtn:hover { color: var(--accent); border-color: var(--brand-300); }

    main.chat { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 12px; }

    .welcome { text-align: center; padding: 6vh 0 12px; animation: rise .5s ease-out both; }
    .welcome .orb {
      width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--brand-400), var(--brand-700)); color: #fff; box-shadow: 0 16px 36px -14px rgba(65, 125, 44, .8);
    }
    .welcome .orb .icon { width: 34px; height: 34px; }
    .welcome h2 { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
    .welcome p { margin: 0 auto 26px; max-width: 460px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .chip {
      text-align: start; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface);
      font-size: 14px; line-height: 1.6; transition: transform .15s, border-color .2s, box-shadow .2s;
    }
    .chip small { display: block; color: var(--accent); font-weight: 700; font-size: 12px; margin-bottom: 2px; }
    .chip:hover { transform: translateY(-2px); border-color: var(--brand-300); box-shadow: var(--shadow); }

    .msg { display: flex; gap: 10px; margin: 18px 0; animation: rise .3s ease-out both; }
    .msg.user { justify-content: flex-start; flex-direction: row-reverse; }
    .avatar {
      flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, var(--brand-400), var(--brand-700)); margin-top: 2px;
    }
    .avatar .icon { width: 18px; height: 18px; }
    .bubble { max-width: min(700px, 88%); line-height: 1.625; font-size: 16px; font-weight: 400; overflow-wrap: break-word; }
    .msg.user .bubble {
      background: var(--user-bg); color: var(--user-text); padding: 10px 16px; border-radius: 18px;
      border-start-end-radius: 6px; white-space: pre-wrap;
    }
    .msg.bot .bubble {
      background: var(--card); border: 1px solid var(--border); padding: 14px 20px; border-radius: 20px;
      border-start-start-radius: 6px; color: var(--answer); backdrop-filter: blur(12px);
    }
    .msg.bot .bubble.err { border-color: var(--danger); color: var(--danger); }
    .bubble p { margin: 0 0 10px; } .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 4px 0 10px; padding-inline-start: 22px; }
    .bubble li { margin: 4px 0; }
    .bubble li::marker { color: var(--accent); font-weight: 700; }
    .bubble strong { font-weight: 700; color: var(--strong); }
    .bubble h3, .bubble h4 { margin: 4px 0 10px; font-size: 16px; font-weight: 700; color: var(--accent); }
    .bubble a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .bubble code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: 13px; direction: ltr; unicode-bidi: isolate; }
    .bubble pre { background: var(--surface-2); padding: 12px; border-radius: 12px; overflow-x: auto; direction: ltr; }
    .bubble pre code { background: none; padding: 0; }
    .tbl { overflow-x: auto; margin: 2px 0 12px; border: 1px solid var(--border); border-radius: 14px; }
    .tbl:last-child { margin-bottom: 0; }
    .bubble table { border-collapse: collapse; width: 100%; font-size: 15px; direction: rtl; }
    .bubble th, .bubble td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: right; vertical-align: top; }
    .bubble th { background: var(--th-bg); color: var(--accent); font-weight: 700; font-size: 14px; white-space: nowrap; }
    .bubble td:first-child { font-weight: 600; color: var(--strong-soft); }
    .bubble td:last-child { white-space: nowrap; }
    .bubble tbody tr:nth-child(even) td { background: var(--row-alt); }
    .bubble tr:last-child td { border-bottom: 0; }
    .shimmer {
      font-weight: 600; background: linear-gradient(90deg, var(--faint) 0%, var(--accent) 45%, var(--faint) 90%);
      background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 1.6s linear infinite;
    }
    .thinking .avatar-pulse { animation: pulse 1.4s ease-in-out infinite; }
    .caret { display: inline-block; width: 8px; height: 8px; margin-inline-start: 6px; border-radius: 50%; background: var(--accent); vertical-align: middle; animation: pulse 1s ease-in-out infinite; }
    .tools { display: flex; gap: 6px; margin-top: 8px; }
    .tools button { border: 0; background: none; color: var(--faint); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 6px; }
    .tools button:hover { color: var(--accent); }
    .tools .icon { width: 15px; height: 15px; }
    .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .typing { display: inline-flex; gap: 4px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-400); animation: blink 1.2s infinite both; }
    .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }

    footer.composer { padding: 10px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    .box {
      max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
      transition: border-color .2s, box-shadow .2s;
    }
    .box:focus-within { border-color: var(--brand-300); box-shadow: 0 0 0 4px rgba(114, 179, 84, .14), var(--shadow); }
    .box textarea {
      flex: 1; resize: none; border: 0; outline: none; background: none; padding: 8px 10px; max-height: 180px;
      line-height: 1.7; font-size: 15px;
    }
    .send {
      flex: none; width: 42px; height: 42px; border-radius: 14px; border: 0; display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, var(--brand-500), var(--brand-700)); transition: transform .15s, opacity .2s;
    }
    .send:disabled { opacity: .4; cursor: default; }
    .send:not(:disabled):active { transform: scale(.94); }
    .send.stop { background: var(--ink); }
    :root[data-theme="dark"] .send.stop { background: #3a3352; }
    .hint { max-width: 820px; margin: 8px auto 0; text-align: center; font-size: 11.5px; color: var(--faint); }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: none; } }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    @media (max-width: 560px) {
      .chips { grid-template-columns: 1fr; }
      .title span { display: none; }
      .hint { display: none; }
      header.top { gap: 8px; padding-inline: 12px; }
      .iconbtn { width: 36px; height: 36px; }
      .wrap { padding-inline: 12px; }
      /* answers use the full width on phones */
      .msg.bot .avatar { display: none; }
      .msg.bot > div { width: 100%; }
      .msg.bot .bubble { max-width: 100%; padding: 12px 14px; }
      .msg.user .bubble { max-width: 88%; }

      /* tables become one card per row: "label: value" lines, nothing squeezed */
      .tbl { border: 0; overflow: visible; margin: 2px 0 10px; }
      .bubble table, .bubble tbody, .bubble tr, .bubble td { display: block; width: 100%; }
      .bubble thead { display: none; }
      .bubble tr {
        border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px;
        background: var(--row-alt);
      }
      .bubble tbody tr:nth-child(even) td { background: none; }
      .bubble td {
        display: flex; gap: 10px; align-items: baseline; justify-content: space-between;
        padding: 5px 0; border-bottom: 1px dashed var(--border); white-space: normal !important; text-align: start;
      }
      .bubble td:last-child { border-bottom: 0; }
      .bubble td::before {
        content: attr(data-label); flex: none; color: var(--accent); font-weight: 700; font-size: 13px;
      }
      .bubble td > .v { text-align: end; }
      /* last column is usually the fee: make it stand out */
      .bubble td:last-child > .v { font-weight: 700; color: var(--strong); }
      .bubble td:first-child { font-weight: 600; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></symbol>
  </svg>

  <!-- Login -->
  <section class="login" id="login">
    <form class="card" id="loginForm" autocomplete="off">
      <img class="logo-light" src="/logo.png" alt="Azoom" />
      <img class="logo-dark" src="/assets/logo-footer-D_RLrrBR.png" alt="Azoom" />
      <div class="badge"><svg class="icon" style="width:14px;height:14px"><use href="#i-lock"/></svg><span data-t="internal"></span></div>
      <h1 data-t="name"></h1>
      <p class="sub" data-t="loginSub"></p>
      <div class="field">
        <input id="pw" type="password" required autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-ph="password" />
        <button type="button" id="togglePw" aria-label="Show password"><svg class="icon"><use href="#i-eye"/></svg></button>
      </div>
      <label class="remember"><input type="checkbox" id="remember" /> <span data-t="remember"></span></label>
      <button class="primary" id="loginBtn" type="submit" data-t="enter"></button>
      <div class="error" id="loginErr" role="alert"></div>
      <a class="back" href="/malaysia" data-t="backToSite"></a>
    </form>
  </section>

  <!-- Chat -->
  <section class="app hidden" id="app">
    <header class="top">
      <img class="logo-light" src="/logo.png" alt="Azoom" />
      <img class="logo-dark" src="/assets/logo-footer-D_RLrrBR.png" alt="Azoom" />
      <div class="title"><b data-t="name"></b><span><i class="dot"></i><span data-t="online"></span></span></div>
      <button class="iconbtn" id="newChat" data-title="newChat"><svg class="icon"><use href="#i-plus"/></svg></button>
      <button class="iconbtn" id="themeBtn" data-title="theme"><svg class="icon"><use id="themeIcon" href="#i-moon"/></svg></button>
      <a class="iconbtn" href="/malaysia" data-title="backToSite"><svg class="icon"><use href="#i-home"/></svg></a>
      <button class="iconbtn" id="logout" data-title="logout"><svg class="icon"><use href="#i-lock"/></svg></button>
    </header>

    <main class="chat" id="chat">
      <div class="wrap" id="thread">
        <div class="welcome" id="welcome">
          <div class="orb"><svg class="icon"><use href="#i-spark"/></svg></div>
          <h2 data-t="hello"></h2>
          <p data-t="helloSub"></p>
          <div class="chips" id="chips"></div>
        </div>
      </div>
    </main>

    <footer class="composer">
      <form class="box" id="composer">
        <textarea id="input" rows="1" data-ph="ask"></textarea>
        <button class="send" id="sendBtn" type="submit" disabled aria-label="Send"><svg class="icon"><use id="sendIcon" href="#i-send"/></svg></button>
      </form>
      <div class="hint" data-t="hint"></div>
    </footer>
  </section>

  <script>
  (() => {
    // ---------- Settings shared with the main site (theme + language) ----------
    const store = {
      get(area, k) { try { return window[area].getItem(k); } catch { return null; } },
      set(area, k, v) { try { window[area].setItem(k, v); } catch {} },
      del(area, k) { try { window[area].removeItem(k); } catch {} },
    };
    const root = document.documentElement;
    let theme = store.get('localStorage', 'azoom-theme') === 'dark' ? 'dark' : 'light';
    const lang = (store.get('localStorage', 'azoom-language') || 'ar') === 'ar' ? 'ar' : 'en';
    root.lang = lang; root.dir = lang === 'ar' ? 'rtl' : 'ltr';

    const T = {
      ar: {
        name: 'أزوم الزكي', internal: 'للاستخدام الداخلي فقط', loginSub: 'مساعد فريق أزوم الذكي — أدخل كلمة المرور للمتابعة',
        password: 'كلمة المرور', remember: 'تذكرني على هذا الجهاز', enter: 'دخول', checking: 'جارٍ التحقق…',
        wrong: 'كلمة المرور غير صحيحة', tooMany: 'محاولات كثيرة خاطئة. حاول بعد 15 دقيقة.', notConfigured: 'الخادم غير مُعدّ بعد: أضف TEAM_PASSWORD و ANTHROPIC_API_KEY في إعدادات Vercel ثم أعد النشر.', netErr: 'تعذر الاتصال. تحقق من الإنترنت وحاول مجددًا.',
        backToSite: 'العودة إلى الموقع', online: 'جاهز للمساعدة', newChat: 'محادثة جديدة', theme: 'الوضع الليلي', logout: 'تسجيل الخروج',
        hello: 'أهلًا بفريق أزوم 👋', helloSub: 'إجابات دقيقة وسريعة لكل استفسارات طلابك.',
        ask: 'اكتب سؤالك هنا…', hint: 'Enter للإرسال • Shift+Enter لسطر جديد • تحقّق دائمًا من المعلومات المهمة قبل إرسالها للطلاب',
        thinking: 'أفكر…', searching: 'أبحث في الإنترنت…', lookingUp: 'أراجع البيانات…', copy: 'نسخ', copied: 'تم النسخ', stopped: '(تم الإيقاف)',
        chips: [
          ['ماليزيا', 'ما أرخص 5 برامج هندسة في ماليزيا مع رسومها السنوية؟'],
          ['مقارنة', 'قارن رسوم إدارة الأعمال بين UCSI وجامعة تايلور وAPU'],
          ['مصر', 'ما رسوم دراسة الطب في مصر عبر أزوم، وما الأوراق المطلوبة للتقديم؟'],
          ['معلومة عامة', 'كم تبلغ تكلفة المعيشة الشهرية لطالب في كوالالمبور؟'],
        ],
      },
      en: {
        name: 'Smart Azoom', internal: 'Internal use only', loginSub: "The Azoom team's smart assistant — enter the password to continue",
        password: 'Password', remember: 'Remember me on this device', enter: 'Sign in', checking: 'Checking…',
        wrong: 'Wrong password', tooMany: 'Too many wrong attempts. Try again in 15 minutes.', notConfigured: 'The server is not set up yet: add TEAM_PASSWORD and ANTHROPIC_API_KEY in Vercel settings, then redeploy.', netErr: 'Connection failed. Check your internet and try again.',
        backToSite: 'Back to the website', online: 'Ready to help', newChat: 'New chat', theme: 'Dark mode', logout: 'Sign out',
        hello: 'Hello, Azoom team 👋', helloSub: 'Fast, accurate answers to every student enquiry.',
        ask: 'Type your question…', hint: 'Enter to send • Shift+Enter for a new line • Always double-check important facts before sending them to students',
        thinking: 'Thinking…', searching: 'Searching the web…', lookingUp: 'Checking our data…', copy: 'Copy', copied: 'Copied', stopped: '(stopped)',
        chips: [
          ['Malaysia', 'What are the 5 cheapest engineering programmes in Malaysia, with annual fees?'],
          ['Compare', "Compare business administration fees at UCSI, Taylor's and APU"],
          ['Egypt', 'What are the medicine fees in Egypt through Azoom, and which documents are needed to apply?'],
          ['General', 'What is the monthly cost of living for a student in Kuala Lumpur?'],
        ],
      },
    }[lang];

    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t]; });
    document.querySelectorAll('[data-ph]').forEach(el => { el.placeholder = T[el.dataset.ph]; });
    document.querySelectorAll('[data-title]').forEach(el => { el.title = T[el.dataset.title]; el.setAttribute('aria-label', T[el.dataset.title]); });
    document.title = T.name;

    const applyTheme = () => {
      root.dataset.theme = theme;
      document.getElementById('themeIcon').setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
    };
    applyTheme();

    // ---------- Safe, small Markdown renderer ----------
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    function inline(s) {
      return esc(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1$2') // no italics: they read badly in Arabic
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    }
    function md(src) {
      const lines = src.replace(/\r/g, '').split('\n');
      let html = '', i = 0;
      const isRow = l => /^\s*\|.*\|\s*$/.test(l);
      const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      while (i < lines.length) {
        const l = lines[i];
        if (/^```/.test(l)) {
          const code = []; i++;
          while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
          i++; html += `<pre><code>${esc(code.join('\n'))}</code></pre>`; continue;
        }
        if (isRow(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
          const head = cells(l); i += 2; const rows = [];
          while (i < lines.length && isRow(lines[i])) rows.push(cells(lines[i++]));
          html += `<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>` +
            rows.map(r => `<tr>${r.map((c, k) => `<td data-label="${esc(head[k] || '')}"><span class="v">${inline(c)}</span></td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
          continue;
        }
        const h = l.match(/^(#{1,4})\s+(.*)/);
        if (h) { html += `<h${h[1].length > 2 ? 4 : 3}>${inline(h[2])}</h${h[1].length > 2 ? 4 : 3}>`; i++; continue; }
        if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
          const ordered = /^\s*\d+[.)]/.test(l); const items = [];
          while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ''));
          html += `<${ordered ? 'ol' : 'ul'}>${items.map(t => `<li>${inline(t)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`; continue;
        }
        if (!l.trim()) { i++; continue; }
        const para = [];
        while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*([-*•]|\d+[.)])\s+)/.test(lines[i]) && !isRow(lines[i])) para.push(lines[i++]);
        html += `<p>${para.map(inline).join('<br>')}</p>`;
      }
      return html;
    }

    // Copy text for WhatsApp: tables become one line per row, **bold** becomes *bold*, no Markdown symbols.
    function toWhatsApp(src) {
      const lines = src.replace(/\r/g, '').split('\n'); const out = [];
      const isRow = l => /^\s*\|.*\|\s*$/.test(l);
      const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const plain = s => s.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1: $2');
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        if (isRow(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
          i += 2;
          while (i < lines.length && isRow(lines[i])) {
            const [first, ...rest] = cells(lines[i++]).map(plain);
            out.push(`*${first}*` + (rest.length ? ': ' + rest.filter(Boolean).join(' — ') : ''));
          }
          i--; continue;
        }
        const h = l.match(/^#{1,4}\s+(.*)/);
        if (h) { out.push(`*${plain(h[1])}*`); continue; }
        out.push(l.replace(/^\s*[-*]\s+/, '• ').replace(/\*\*([^*]+)\*\*/g, '*$1*').replace(/`([^`]+)`/g, '$1').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1: $2'));
      }
      return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    // ---------- Login ----------
    const $ = id => document.getElementById(id);
    let password = store.get('sessionStorage', 'azoom-ai-pass') || store.get('localStorage', 'azoom-ai-pass') || '';

    async function api(body, signal) {
      return fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password, ...body }), signal });
    }
    function showApp() {
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      restore(); $('input').focus();
    }
    function showLogin(msg) {
      $('app').classList.add('hidden'); $('login').classList.remove('hidden');
      $('loginErr').textContent = msg || ''; $('pw').focus();
    }

    $('togglePw').onclick = () => { const p = $('pw'); p.type = p.type === 'password' ? 'text' : 'password'; };
    $('loginForm').onsubmit = async e => {
      e.preventDefault();
      const btn = $('loginBtn'); btn.disabled = true; btn.textContent = T.checking; $('loginErr').textContent = '';
      password = $('pw').value;
      try {
        const r = await api({ check: true });
        if (r.ok) {
          store.set('sessionStorage', 'azoom-ai-pass', password);
          if ($('remember').checked) store.set('localStorage', 'azoom-ai-pass', password);
          $('pw').value = ''; showApp();
        } else {
          $('loginErr').textContent = r.status === 503 ? T.notConfigured : r.status === 429 ? T.tooMany : T.wrong;
          const card = $('loginForm'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        }
      } catch { $('loginErr').textContent = T.netErr; }
      btn.disabled = false; btn.textContent = T.enter;
    };
    $('logout').onclick = () => {
      store.del('sessionStorage', 'azoom-ai-pass'); store.del('localStorage', 'azoom-ai-pass');
      store.del('sessionStorage', 'azoom-ai-chat'); password = ''; history = []; clearThread(); showLogin();
    };
    $('themeBtn').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('localStorage', 'azoom-theme', theme); applyTheme(); };

    // ---------- Chat ----------
    let history = [];          // [{role, content}]
    let controller = null;     // aborts the running answer
    const thread = $('thread'), chat = $('chat'), input = $('input'), sendBtn = $('sendBtn');

    T.chips.forEach(([tag, q]) => {
      const b = document.createElement('button'); b.className = 'chip'; b.type = 'button';
      b.innerHTML = `<small>${esc(tag)}</small>${esc(q)}`; b.onclick = () => send(q); $('chips').appendChild(b);
    });

    const save = () => store.set('sessionStorage', 'azoom-ai-chat', JSON.stringify(history));
    const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };
    function clearThread() { thread.querySelectorAll('.msg').forEach(n => n.remove()); $('welcome').classList.remove('hidden'); }

    function addMessage(role, content) {
      $('welcome').classList.add('hidden');
      const row = document.createElement('div'); row.className = `msg ${role === 'user' ? 'user' : 'bot'}`;
      const bubble = document.createElement('div'); bubble.className = 'bubble';
      bubble.dir = role === 'user' ? 'auto' : 'rtl'; // answers are always Arabic
      if (role === 'user') bubble.textContent = content;
      else {
        const av = document.createElement('div'); av.className = 'avatar avatar-pulse';
        av.innerHTML = '<svg class="icon"><use href="#i-spark"/></svg>'; row.appendChild(av);
        bubble.innerHTML = content ? md(content) : '';
      }
      const col = document.createElement('div'); col.appendChild(bubble);
      if (role !== 'user') col.appendChild(copyTools(() => toWhatsApp(bubble.dataset.raw || content)));
      row.appendChild(col); thread.appendChild(row); scrollDown();
      return bubble;
    }
    function copyTools(getText) {
      const t = document.createElement('div'); t.className = 'tools';
      const b = document.createElement('button'); b.type = 'button';
      b.innerHTML = `<svg class="icon"><use href="#i-copy"/></svg><span>${T.copy}</span>`;
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(getText()); } catch {}
        b.innerHTML = `<svg class="icon"><use href="#i-check"/></svg><span>${T.copied}</span>`;
        setTimeout(() => { b.innerHTML = `<svg class="icon"><use href="#i-copy"/></svg><span>${T.copy}</span>`; }, 1600);
      };
      t.appendChild(b); return t;
    }
    function restore() {
      clearThread();
      try { history = JSON.parse(store.get('sessionStorage', 'azoom-ai-chat') || '[]'); } catch { history = []; }
      history.forEach(m => addMessage(m.role, m.content));
    }
    function setBusy(busy) {
      sendBtn.classList.toggle('stop', busy);
      $('sendIcon').setAttribute('href', busy ? '#i-stop' : '#i-send');
      sendBtn.disabled = !busy && !input.value.trim();
    }

    async function send(text) {
      text = text.trim(); if (!text || controller) return;
      input.value = ''; autosize();
      history.push({ role: 'user', content: text }); save(); addMessage('user', text);

      const bubble = addMessage('assistant', '');
      const row = bubble.closest('.msg'); row.classList.add('thinking');
      bubble.innerHTML = `<span class="status"><span class="shimmer">${T.thinking}</span></span>`;
      let answer = '', frame = 0, failed = '', streaming = true;
      const paint = () => {
        frame = 0; bubble.dataset.raw = answer;
        bubble.innerHTML = md(answer) + (streaming ? '<span class="caret"></span>' : '');
        // keep the live dot at the end of the last paragraph or list item rather than on its own line
        const caret = bubble.querySelector('.caret'), last = caret && caret.previousElementSibling;
        if (last && /^(P|UL|OL)$/.test(last.tagName)) (last.tagName === 'P' ? last : last.lastElementChild || last).appendChild(caret);
        scrollDown();
      };

      controller = new AbortController(); setBusy(true);
      try {
        const r = await api({ messages: history }, controller.signal);
        if (r.status === 401) { controller = null; setBusy(false); history.pop(); save(); showLogin(T.wrong); return; }
        if (!r.ok || !r.body) throw new Error((await r.json().catch(() => ({}))).error || T.netErr);
        const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
        for (;;) {
          const { value, done } = await reader.read(); if (done) break;
          buf += dec.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf('\n')) >= 0) {
            const line = buf.slice(0, nl); buf = buf.slice(nl + 1); if (!line.trim()) continue;
            const ev = JSON.parse(line);
            if (ev.t === 'text') { answer += ev.v; if (!frame) frame = requestAnimationFrame(paint); }
            else if (ev.t === 'reset') {
              answer = ''; if (frame) { cancelAnimationFrame(frame); frame = 0; }
              bubble.innerHTML = `<span class="status"><span class="shimmer">${T.lookingUp}</span></span>`;
            }
            else if (ev.t === 'status' && !answer) bubble.innerHTML = ev.v === 'checking'
              ? `<span class="status"><span class="shimmer">${T.lookingUp}</span></span>`
              : `<span class="status"><svg class="icon" style="width:16px;height:16px;color:var(--accent)"><use href="#i-globe"/></svg><span class="shimmer">${T.searching}</span></span>`;
            else if (ev.t === 'status' && ev.v === 'searching') { answer += '\n\n'; }
            else if (ev.t === 'error') failed = ev.v;
          }
        }
      } catch (err) {
        if (err.name === 'AbortError') answer += (answer ? '\n\n' : '') + T.stopped;
        else failed = err.message || T.netErr;
      }
      if (frame) cancelAnimationFrame(frame);
      streaming = false; row.classList.remove('thinking'); paint();
      if (failed && !answer) { bubble.classList.add('err'); bubble.textContent = failed; history.pop(); }
      else {
        if (failed) bubble.insertAdjacentHTML('beforeend', `<p class="error">${esc(failed)}</p>`);
        history.push({ role: 'assistant', content: answer });
      }
      save(); controller = null; setBusy(false); input.focus();
    }

    function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; sendBtn.disabled = !controller && !input.value.trim(); }
    input.addEventListener('input', autosize);
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); } });
    $('composer').onsubmit = e => { e.preventDefault(); if (controller) controller.abort(); else send(input.value); };
    $('newChat').onclick = () => { if (controller) controller.abort(); history = []; save(); clearThread(); input.focus(); };

    // ---------- Start ----------
    if (password) {
      api({ check: true }).then(r => r.ok ? showApp() : showLogin()).catch(() => showLogin(T.netErr));
    } else showLogin();
  })();
  </script>
</body>
